name: Release Stamp

on:
  pull_request:
    types: [closed]
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    name: Stamp Changelog & Bump Version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine bump type from branch name
        id: bump
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          AUTHOR="@${{ github.event.pull_request.user.login }}"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          # Branch naming convention
          if [[ "$BRANCH" == major/* || "$BRANCH" == major-* ]]; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == patch/* || "$BRANCH" == patch-* || \
                  "$BRANCH" == fix/* || "$BRANCH" == fix-* || \
                  "$BRANCH" == hotfix/* || "$BRANCH" == hotfix-* ]]; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp changelog and bump version
        run: |
          node scripts/release_stamp.js \
            --bump "${{ steps.bump.outputs.bump }}" \
            --author "${{ steps.bump.outputs.author }}"

      - name: Sync dependencies & lockfile
        run: |
          uv sync --extra dev

      - name: Commit and push release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt CHANGELOG.md pyproject.toml uv.lock
          RELEASE_VERSION=$(cat version.txt | sed 's/-SNAPSHOT//')
          git commit -m "Setting release v${RELEASE_VERSION} from ${{ steps.bump.outputs.branch }} [skip ci]"
          git push
