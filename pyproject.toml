[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saesV2"
version = "0.2.0"
description = "Stochastic Algorithm Evaluation Suite - Scientific Python library for statistical benchmarking"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SAES Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.27.0",
    "pandas-stubs>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]
all = [
    "saesV2[viz,api]",
]

[project.scripts]
saes-api = "saesV2.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saesV2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=saesV2 --cov-report=term-missing"
